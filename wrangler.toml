# ============================================================
# 海外导航站（ss99.ccwu.cc）—— Cloudflare Workers + Assets
#
# 部署方式一（推荐，用命令行）：
#   npx wrangler deploy
#
# 部署方式二（网页上传，你一直在用的方式）：
#   CF 控制台 → Workers 和 Pages → 创建 → Workers →
#   把 public/ 和 src/ 与 wrangler.toml 一起上传（或用 GitHub 连接仓库）
#   然后在「设置 → 域和路由」里添加自定义域 ss99.ccwu.cc
#
# name 必须与 CF 控制台上的 Worker 名字一致
# ============================================================
name = "haiwai-dao-hang"
# 账号 ID 写死，deploy 时不再交互提问选账号
account_id = "d49e51b1279804c22035a33a9c1cb06e"
compatibility_date = "2026-09-01"
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"

# 路由在 CF 控制台配置：Workers → haiwai-dao-hang → 设置 → 域和路由
# ss99.ccwu.cc/*

# 请求日志（CF 控制台 → Workers → 该站 → Observability 实时查看）
# 用于查清流量来源：Googlebot / 各类爬虫 / 扫描机器人
#
# ⚠️ invocation_logs = true 是关键：
#    只写 enabled = true 只会记录 console.log 的输出，
#    而本站代码里没有任何 console.log —— 那样等于什么都看不到。
#    invocation_logs 才负责记录「每一次请求」本身（URL / UA / IP / 状态码）。
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true      # ★ 记录每次调用，缺了它看不到访问者
head_sampling_rate = 1      # 100% 采样，不漏
